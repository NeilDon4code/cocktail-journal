<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>調酒筆記</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17110f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="調酒筆記">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #17110f;
    --bg-2: #1f1815;
    --surface: #251d19;
    --surface-2: #2e241f;
    --line: #3a2e27;
    --line-soft: #322620;
    --ink: #f2e9df;
    --ink-soft: #cdbfb2;
    --muted: #9a8a7c;
    --faint: #6f6256;
    --brass: #c99a4e;
    --brass-bright: #e0b666;
    --brass-soft: #3a2e1c;
    --wine: #a6555b;
    --ok: #7fae86;

    --radius: 12px;
    --serif: "Iowan Old Style", "Noto Serif TC", "Songti TC", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--sans);
    background:
      radial-gradient(120% 80% at 100% 0%, #24180f 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 44px 20px 90px; }

  /* Header */
  header.top { margin-bottom: 30px; }
  .kicker { font-size: 0.72rem; letter-spacing: 0.28em; color: var(--brass); margin: 0 0 8px; text-transform: uppercase; }
  h1 { font-family: var(--serif); font-size: 2.5rem; font-weight: 600; letter-spacing: -0.01em; margin: 0; line-height: 1.05; }
  .tagline { color: var(--muted); font-size: 0.95rem; margin: 8px 0 0; font-family: var(--serif); font-style: italic; }

  .statbar { display: flex; gap: 26px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; }
  .stat .n { font-family: var(--serif); font-size: 1.7rem; font-weight: 600; line-height: 1; color: var(--brass-bright); }
  .stat .lb { font-size: 0.74rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.04em; }

  /* Panels */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

  /* Add form */
  .composer { padding: 22px 22px 20px; margin-bottom: 26px; }
  .composer h2 { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; margin: 0 0 16px; color: var(--ink); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .field.full { grid-column: 1 / -1; }
  .field label { display: block; font-size: 0.76rem; color: var(--brass); letter-spacing: 0.06em; margin-bottom: 6px; }
  .field input[type=text], .field input[type=date], .field textarea {
    width: 100%; font-family: var(--sans); font-size: 0.95rem; color: var(--ink);
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; transition: border-color .15s;
  }
  .field textarea { resize: vertical; min-height: 62px; line-height: 1.5; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--brass); }
  .field input::placeholder, .field textarea::placeholder { color: var(--faint); }

  /* Star input */
  .stars-input { display: inline-flex; gap: 4px; }
  .stars-input button {
    background: none; border: none; cursor: pointer; padding: 2px;
    font-size: 1.5rem; line-height: 1; color: var(--faint); transition: color .1s, transform .1s;
  }
  .stars-input button:hover { transform: scale(1.12); }
  .stars-input button.on { color: var(--brass-bright); }
  .stars-input button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }

  .composer-actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .btn {
    font-family: var(--sans); font-size: 0.9rem; font-weight: 600; cursor: pointer;
    padding: 10px 20px; border-radius: 8px; border: 1px solid transparent; transition: background .15s, border-color .15s;
  }
  .btn.primary { background: var(--brass); color: #23180a; }
  .btn.primary:hover { background: var(--brass-bright); }
  .btn.ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.small { font-size: 0.8rem; padding: 6px 12px; font-weight: 500; }
  .btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .editing-note { font-size: 0.82rem; color: var(--wine); margin-left: auto; }

  /* Controls */
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .search { flex: 1; min-width: 180px; position: relative; }
  .search input {
    width: 100%; font-family: var(--sans); font-size: 0.92rem; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px 9px 34px;
  }
  .search input:focus { outline: none; border-color: var(--brass); }
  .search .mag { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.9rem; }
  select.sort {
    font-family: var(--sans); font-size: 0.88rem; color: var(--ink-soft);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer;
  }
  select.sort:focus { outline: none; border-color: var(--brass); }

  /* Entries */
  .entries { display: flex; flex-direction: column; gap: 14px; }
  .card { padding: 18px 20px; position: relative; }
  .card .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .card .name { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .card .bar { font-size: 0.9rem; color: var(--brass); }
  .card .bar::before { content: "@ "; color: var(--faint); }
  .card .date { font-size: 0.78rem; color: var(--muted); margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .card .stars { color: var(--brass-bright); font-size: 1rem; letter-spacing: 2px; margin-top: 8px; }
  .card .stars .off { color: var(--line); }
  .card .meta { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .card .block .k { font-size: 0.72rem; color: var(--brass); letter-spacing: 0.06em; margin-bottom: 3px; }
  .card .block .v { font-size: 0.92rem; color: var(--ink-soft); white-space: pre-wrap; }
  .card .block.ingredients .v { color: var(--muted); font-style: italic; font-family: var(--serif); }
  .card .row-actions { display: flex; gap: 8px; margin-top: 14px; opacity: 0; transition: opacity .15s; }
  .card:hover .row-actions, .card:focus-within .row-actions { opacity: 1; }
  .card .row-actions .btn { color: var(--muted); }
  .card .row-actions .btn:hover { color: var(--ink); }
  .del:hover { color: var(--wine) !important; border-color: var(--wine) !important; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .glass { font-size: 2.6rem; margin-bottom: 12px; opacity: .6; }
  .empty .t { font-family: var(--serif); font-size: 1.2rem; color: var(--ink-soft); margin-bottom: 4px; }
  .empty .s { font-size: 0.9rem; }

  .footer-actions { display: flex; gap: 10px; justify-content: center; margin-top: 34px; flex-wrap: wrap; }
  .footer-actions .btn { border-color: var(--line-soft); color: var(--muted); }
  .footer-actions .btn:hover { color: var(--ink-soft); background: var(--surface); }
  .savenote { text-align: center; font-size: 0.76rem; color: var(--faint); margin-top: 16px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #0f0b09; color: var(--ink); padding: 11px 20px; border-radius: 8px; border: 1px solid var(--line);
    font-size: 0.86rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    h1 { font-size: 2rem; }
    .form-grid { grid-template-columns: 1fr; }
    .card .date { margin-left: 0; width: 100%; }
    .card .row-actions { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="kicker">Cocktail Journal</p>
    <h1>調酒筆記</h1>
    <p class="tagline">記下每一杯的店家、風味與心得。</p>
    <div class="statbar">
      <div class="stat"><span class="n" id="statCount">0</span><span class="lb">杯數</span></div>
      <div class="stat"><span class="n" id="statAvg">—</span><span class="lb">平均評分</span></div>
      <div class="stat"><span class="n" id="statBars">0</span><span class="lb">造訪店家</span></div>
      <div class="stat"><span class="n" id="statTop">—</span><span class="lb">最高分的一杯</span></div>
    </div>
  </header>

  <!-- 新增 -->
  <div class="panel composer">
    <h2 id="composerTitle">記一杯</h2>
    <div class="form-grid">
      <div class="field">
        <label for="fBar">店家</label>
        <input type="text" id="fBar" placeholder="例：後院 Backyard" autocomplete="off">
      </div>
      <div class="field">
        <label for="fName">酒名稱</label>
        <input type="text" id="fName" placeholder="例：Negroni" autocomplete="off">
      </div>
      <div class="field full">
        <label for="fIngredients">原料</label>
        <input type="text" id="fIngredients" placeholder="例：琴酒、Campari、甜香艾酒（1:1:1）" autocomplete="off">
      </div>
      <div class="field full">
        <label for="fNotes">感想</label>
        <textarea id="fNotes" placeholder="香氣、口感、平衡、當下的感覺…"></textarea>
      </div>
      <div class="field">
        <label>評分</label>
        <div class="stars-input" id="starInput" role="radiogroup" aria-label="評分"></div>
      </div>
      <div class="field">
        <label for="fDate">日期</label>
        <input type="date" id="fDate">
      </div>
    </div>
    <div class="composer-actions">
      <button class="btn primary" id="saveBtn">加入筆記</button>
      <button class="btn ghost" id="clearBtn" style="display:none">取消編輯</button>
      <span class="editing-note" id="editingNote" style="display:none">編輯中</span>
    </div>
  </div>

  <!-- 控制列 -->
  <div class="controls">
    <div class="search">
      <span class="mag">⌕</span>
      <input type="text" id="searchInput" placeholder="搜尋店家、酒名、原料、感想…" autocomplete="off">
    </div>
    <select class="sort" id="sortSelect">
      <option value="date-desc">最新優先</option>
      <option value="date-asc">最舊優先</option>
      <option value="rating-desc">評分高→低</option>
      <option value="rating-asc">評分低→高</option>
      <option value="bar">依店家</option>
    </select>
  </div>

  <!-- 列表 -->
  <div class="entries" id="entries"></div>

  <div class="footer-actions">
    <button class="btn ghost small" id="exportJson">備份資料</button>
    <button class="btn ghost small" id="importBtn">還原備份</button>
    <input type="file" id="importFile" accept=".json" hidden>
    <button class="btn ghost small" id="exportCsv">匯出 CSV</button>
  </div>
  <p class="savenote">資料只存在這台電腦的瀏覽器裡，不會上傳。建議偶爾「備份資料」存一份。</p>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "cocktailJournal.v1";
  var entries = load();
  var editingId = null;
  var formRating = 0;

  var $ = function (id) { return document.getElementById(id); };

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
    catch (e) { showToast("⚠ 儲存失敗，瀏覽器可能停用了儲存"); }
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var p = iso.split("-");
    if (p.length !== 3) return iso;
    return p[0] + " / " + p[1] + " / " + p[2];
  }

  // ---- 星星輸入 ----
  function renderStarInput() {
    var box = $("starInput");
    box.innerHTML = "";
    for (var i = 1; i <= 5; i++) {
      (function (val) {
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", val + " 分");
        b.className = val <= formRating ? "on" : "";
        b.textContent = val <= formRating ? "★" : "☆";
        b.addEventListener("click", function () {
          formRating = (formRating === val) ? 0 : val; // 再點一次同一顆可歸零
          renderStarInput();
        });
        box.appendChild(b);
      })(i);
    }
  }

  function starsDisplay(rating) {
    var s = "";
    for (var i = 1; i <= 5; i++) {
      s += i <= rating ? "★" : '<span class="off">★</span>';
    }
    return s;
  }

  // ---- 表單 ----
  function resetForm() {
    editingId = null;
    formRating = 0;
    $("fBar").value = "";
    $("fName").value = "";
    $("fIngredients").value = "";
    $("fNotes").value = "";
    $("fDate").value = todayISO();
    renderStarInput();
    $("composerTitle").textContent = "記一杯";
    $("saveBtn").textContent = "加入筆記";
    $("clearBtn").style.display = "none";
    $("editingNote").style.display = "none";
  }

  function startEdit(id) {
    var e = entries.find(function (x) { return x.id === id; });
    if (!e) return;
    editingId = id;
    formRating = e.rating || 0;
    $("fBar").value = e.bar || "";
    $("fName").value = e.name || "";
    $("fIngredients").value = e.ingredients || "";
    $("fNotes").value = e.notes || "";
    $("fDate").value = e.date || todayISO();
    renderStarInput();
    $("composerTitle").textContent = "編輯這杯";
    $("saveBtn").textContent = "儲存修改";
    $("clearBtn").style.display = "inline-block";
    $("editingNote").style.display = "inline";
    window.scrollTo({ top: 0, behavior: "smooth" });
    $("fBar").focus();
  }

  function saveForm() {
    var bar = $("fBar").value.trim();
    var name = $("fName").value.trim();
    if (!bar && !name) { showToast("至少填一下店家或酒名吧"); $("fName").focus(); return; }

    var payload = {
      bar: bar,
      name: name,
      ingredients: $("fIngredients").value.trim(),
      notes: $("fNotes").value.trim(),
      rating: formRating,
      date: $("fDate").value || todayISO()
    };

    if (editingId) {
      var idx = entries.findIndex(function (x) { return x.id === editingId; });
      if (idx !== -1) entries[idx] = Object.assign({}, entries[idx], payload);
      showToast("已更新");
    } else {
      payload.id = uid();
      entries.push(payload);
      showToast("已記下這一杯 🍸");
    }
    save();
    resetForm();
    render();
  }

  function removeEntry(id) {
    var e = entries.find(function (x) { return x.id === id; });
    var label = e && (e.name || e.bar) ? "「" + (e.name || e.bar) + "」" : "這筆";
    if (!confirm("確定要刪除 " + label + " 嗎？")) return;
    entries = entries.filter(function (x) { return x.id !== id; });
    if (editingId === id) resetForm();
    save();
    render();
    showToast("已刪除");
  }

  // ---- 列表 ----
  function currentList() {
    var q = $("searchInput").value.trim().toLowerCase();
    var sort = $("sortSelect").value;
    var list = entries.slice();

    if (q) {
      list = list.filter(function (e) {
        return [e.bar, e.name, e.ingredients, e.notes].join(" ").toLowerCase().indexOf(q) !== -1;
      });
    }

    list.sort(function (a, b) {
      switch (sort) {
        case "date-asc": return (a.date || "").localeCompare(b.date || "");
        case "rating-desc": return (b.rating || 0) - (a.rating || 0) || (b.date || "").localeCompare(a.date || "");
        case "rating-asc": return (a.rating || 0) - (b.rating || 0) || (b.date || "").localeCompare(a.date || "");
        case "bar": return (a.bar || "").localeCompare(b.bar || "", "zh-Hant") || (b.date || "").localeCompare(a.date || "");
        default: return (b.date || "").localeCompare(a.date || ""); // date-desc
      }
    });
    return list;
  }

  function render() {
    renderStats();
    var box = $("entries");
    var list = currentList();

    if (!entries.length) {
      box.innerHTML = '<div class="empty"><div class="glass">🍸</div><div class="t">還沒有任何一杯</div><div class="s">在上面記下第一杯調酒吧。</div></div>';
      return;
    }
    if (!list.length) {
      box.innerHTML = '<div class="empty"><div class="glass">🔍</div><div class="t">找不到符合的紀錄</div><div class="s">換個關鍵字試試。</div></div>';
      return;
    }

    box.innerHTML = list.map(function (e) {
      var parts = [];
      parts.push('<div class="card panel" tabindex="0">');
      parts.push('<div class="head">');
      if (e.name) parts.push('<span class="name">' + escHtml(e.name) + '</span>');
      if (e.bar) parts.push('<span class="bar">' + escHtml(e.bar) + '</span>');
      parts.push('<span class="date">' + escHtml(fmtDate(e.date)) + '</span>');
      parts.push('</div>');
      if (e.rating) parts.push('<div class="stars">' + starsDisplay(e.rating) + '</div>');
      parts.push('<div class="meta">');
      if (e.ingredients) parts.push('<div class="block ingredients"><div class="k">原料</div><div class="v">' + escHtml(e.ingredients) + '</div></div>');
      if (e.notes) parts.push('<div class="block"><div class="k">感想</div><div class="v">' + escHtml(e.notes) + '</div></div>');
      parts.push('</div>');
      parts.push('<div class="row-actions">');
      parts.push('<button class="btn ghost small" data-edit="' + e.id + '">編輯</button>');
      parts.push('<button class="btn ghost small del" data-del="' + e.id + '">刪除</button>');
      parts.push('</div>');
      parts.push('</div>');
      return parts.join("");
    }).join("");

    box.querySelectorAll("[data-edit]").forEach(function (b) {
      b.addEventListener("click", function () { startEdit(this.getAttribute("data-edit")); });
    });
    box.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () { removeEntry(this.getAttribute("data-del")); });
    });
  }

  function renderStats() {
    $("statCount").textContent = entries.length;

    var rated = entries.filter(function (e) { return e.rating > 0; });
    if (rated.length) {
      var avg = rated.reduce(function (s, e) { return s + e.rating; }, 0) / rated.length;
      $("statAvg").textContent = (Math.round(avg * 10) / 10).toFixed(1);
    } else {
      $("statAvg").textContent = "—";
    }

    var bars = {};
    entries.forEach(function (e) { if (e.bar) bars[e.bar] = true; });
    $("statBars").textContent = Object.keys(bars).length;

    var top = null;
    entries.forEach(function (e) {
      if (e.rating > 0 && (!top || e.rating > top.rating)) top = e;
    });
    $("statTop").textContent = top ? (top.name || top.bar || "—") : "—";
    $("statTop").style.fontSize = top && (top.name || "").length > 6 ? "1.1rem" : "";
  }

  function escHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }

  function showToast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._timer); t._timer = setTimeout(function () { t.classList.remove("show"); }, 1900);
  }

  // ---- 匯出 / 匯入 ----
  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  $("exportJson").addEventListener("click", function () {
    if (!entries.length) { showToast("還沒有資料可備份"); return; }
    download("cocktail-journal-backup.json", JSON.stringify(entries, null, 2), "application/json");
    showToast("已下載備份檔");
  });
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function (e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var arr = JSON.parse(ev.target.result);
        if (!Array.isArray(arr)) throw new Error("格式不符");
        // 確保每筆有 id
        arr.forEach(function (x) { if (!x.id) x.id = uid(); });
        entries = arr;
        save(); resetForm(); render(); showToast("已還原備份");
      } catch (err) { showToast("還原失敗：檔案格式不正確"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  $("exportCsv").addEventListener("click", function () {
    if (!entries.length) { showToast("還沒有資料可匯出"); return; }
    var header = ["日期", "店家", "酒名稱", "原料", "感想", "評分"];
    var lines = [header.join(",")];
    currentList().forEach(function (e) {
      var cols = [e.date || "", e.bar || "", e.name || "", e.ingredients || "", e.notes || "", e.rating || ""];
      lines.push(cols.map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(","));
    });
    download("cocktail-journal.csv", "﻿" + lines.join("\n"), "text/csv;charset=utf-8");
    showToast("已匯出 CSV");
  });

  // ---- 綁定 ----
  $("saveBtn").addEventListener("click", saveForm);
  $("clearBtn").addEventListener("click", function () { resetForm(); });
  $("searchInput").addEventListener("input", render);
  $("sortSelect").addEventListener("change", render);
  // Enter 在單行欄位送出（textarea 不攔）
  ["fBar", "fName", "fIngredients"].forEach(function (id) {
    $(id).addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); saveForm(); } });
  });

  // ---- 啟動 ----
  resetForm();
  render();
})();
</script>

<script>
  // 註冊 Service Worker（讓 App 可離線使用）
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function (err) {
        console.log("Service Worker 註冊失敗：", err);
      });
    });
  }
</script>
</body>
</html>
